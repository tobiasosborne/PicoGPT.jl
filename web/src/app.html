<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fcfbf7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply a stored ink choice before first paint (no flash). "paper" | "night" | auto.
			try { const t = localStorage.getItem('pico-ink'); if (t) document.documentElement.dataset.ink = t; } catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
